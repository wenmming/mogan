# .github/workflows/mogan-turbo-build.yml
# Mogan Turbo Build – 高成功率版（修复504超时）
name: Mogan Turbo Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '编译目标平台'
        type: choice
        required: true
        default: 'both'
        options:
          - linux
          - windows
          - both

env:
  BUILD_TYPE: turbo
  # XMAKE_REPO: https://github.com/xmake-io/xmake-repo.git   # 可选：使用自定义镜像

jobs:
  # ============================== Linux ==============================
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'both'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: MoganLab/mogan
          ref: main
          submodules: recursive
          fetch-depth: 1     # 浅克隆加快速度

      - name: Install system dependencies (with retry)
        run: |
          for i in {1..3}; do
            sudo apt-get update -qq && sudo apt-get install -y -qq \
              libcurl4-openssl-dev pkg-config qtbase5-dev \
              libqt5svg5-dev libjpeg-turbo8-dev libpng-dev \
              libgit2-dev libfreetype6-dev libsqlite3-dev && break
            echo "Retry apt install... ($i/3)"
            sleep 5
          done

      - name: Cache xmake
        uses: actions/cache@v4
        id: cache-xmake
        with:
          path: ~/.xmake
          key: xmake-mogan-ubuntu-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-mogan-ubuntu-${{ runner.os }}-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache   # 官方action自带缓存增强

      - name: Configure turbo build (Linux)
        run: |
          xmake f -m release \
            --startup_tab=false \
            --text_toolbar=false \
            --tutorial=false \
            --mupdf=false \
            --debug_with_timestamp=false \
            -c -vD --yes

      - name: Build Mogan Turbo (Linux)
        run: xmake build -j$(nproc) -vD stem

      - name: Package Linux DEB
        run: |
          mkdir -p mogan-turbo_1.0.0_amd64/usr/local/bin
          mkdir -p mogan-turbo_1.0.0_amd64/DEBIAN
          cat > mogan-turbo_1.0.0_amd64/DEBIAN/control << 'DEBEOF'
          Package: mogan-turbo
          Version: 1.0.0
          Architecture: amd64
          Maintainer: Mogan Turbo Builder
          Description: Mogan STEM Turbo Edition (Linux)
          Depends: qtbase5-dev, libqt5svg5-dev, libfreetype6, libcurl4
          Homepage: https://mogan.app
          DEBEOF
          dpkg-deb --build mogan-turbo_1.0.0_amd64
          mv mogan-turbo_1.0.0_amd64.deb mogan-turbo-linux-amd64.deb

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mogan-turbo-linux-amd64
          path: mogan-turbo-linux-amd64.deb
          retention-days: 7

  # ============================== Windows ==============================
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    # 删除 defaults.run.shell 配置，使用默认 PowerShell
    
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MoganLab/mogan
          ref: main
          submodules: recursive
    
      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-git
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-sqlite3
    
      - name: Add MinGW to PATH (PowerShell)
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
    
      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: xmake-windows-${{ hashFiles('xmake.lua') }}
    
      - name: Configure turbo build (Windows)
        run: |
          xmake f -m release -p mingw `
            --toolchain="C:/msys64/mingw64" `
            --startup_tab=false `
            --text_toolbar=false `
            --tutorial=false `
            --mupdf=false `
            --debug_with_timestamp=false `
            -c -vD --yes
    
      - name: Build Mogan Turbo
        run: xmake build -j4 -vD stem
    
      - name: Package ZIP
        run: |
          mkdir mogan-turbo-windows -Force
          Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.FullName -match "build\\windows\\mingw\\release" } | Copy-Item -Destination mogan-turbo-windows -Force
          Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.FullName -match "build\\windows\\mingw\\release" } | Copy-Item -Destination mogan-turbo-windows -Force
          Compress-Archive -Path mogan-turbo-windows -DestinationPath mogan-turbo-windows-amd64.zip -Force
    
      - uses: actions/upload-artifact@v4
        with:
          name: mogan-turbo-windows-amd64
          path: mogan-turbo-windows-amd64.zip
          retention-days: 7

  # ============================== 汇总 ==============================
  summary:
    needs: [build-linux, build-windows]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Print summary
        run: |
          echo "=========================================="
          echo "  Mogan Turbo Build Complete"
          echo "=========================================="
          echo "下载 Artifacts (保留7天):"
          echo "🐧 Linux:  mogan-turbo-linux-amd64.deb"
          echo "  安装: sudo dpkg -i mogan-turbo-linux-amd64.deb"
          echo "🪟 Windows: mogan-turbo-windows-amd64.zip"
          echo "  安装: 解压后运行"
          echo "=========================================="
