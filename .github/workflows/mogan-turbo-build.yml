# .github/workflows/mogan-turbo-windows.yml
# Mogan Windows 极速版 — 基于官方 ci-xmake-windows.yml 改造
#
# 与原版的区别:
#   - 模式: releasedbg → release (关闭调试符号)
#   - 关闭启动页: --startup_tab=false
#   - 关闭教程: --tutorial=false
#   - 关闭 MuPDF: --mupdf=false
#   - 关闭调试时间戳: --debug_with_timestamp=false
#   - 关闭文本浮动工具栏: --text_toolbar=false
#   - 增加重试机制应对 504
#
# 触发方式: workflow_dispatch (手动) / push & PR to main
#
# 预计编译时间: 首次 30-40 分钟 / 缓存命中 5-10 分钟

name: Mogan Turbo Build

on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 🗑️ 清除缓存重新构建
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-windows
  cancel-in-progress: true

jobs:
  windows-turbo:
    name: 🪟 Windows Turbo (mingw)
    runs-on: windows-2025
    timeout-minutes: 60

    env:
      XMAKE_GLOBALDIR: "${{ github.workspace }}\\.xmake-global"

    steps:
      # ================================================================
      # Step 1: 清理缓存 (手动开启时)
      # ================================================================
      - name: Clear cache
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: |
          Remove-Item -Recurse -Force "${{ env.XMAKE_GLOBALDIR }}" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\build" -ErrorAction SilentlyContinue
          Write-Host "✅ Cache cleared"

      # ================================================================
      # Step 2: 安装 xmake (官方 action，自带重试)
      # ================================================================
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4

      - name: Update xmake repo
        run: |
          xrepo update-repo

      # ================================================================
      # Step 3: 检出代码
      # ================================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: MoganLab/mogan
          ref: main
          fetch-depth: 1

      # ================================================================
      # Step 4: 缓存 xrepo 包 (关键！避免重复下载 Qt/MinGW 等)
      # ================================================================
      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XMAKE_GLOBALDIR }}\.xmake\packages
          key: turbo-${{ runner.os }}-${{ runner.arch }}-xrepo-${{ hashFiles('xmake/vars.lua') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-xrepo-

      # ================================================================
      # Step 5: 缓存构建中间产物 (加速增量编译)
      # ================================================================
      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\build\.build_cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-build-

      # ================================================================
      # Step 6: 配置极速版
      # ================================================================
      - name: Configure turbo build
        run: |
          xmake config --policies=build.ccache --yes -vD -m release --plat=windows `
            --startup_tab=false `
            --text_toolbar=false `
            --tutorial=false `
            --mupdf=false `
            --debug_with_timestamp=false
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ Config failed, retrying once..."
            xmake config --policies=build.ccache --yes -vD -m release --plat=windows `
              --startup_tab=false `
              --text_toolbar=false `
              --tutorial=false `
              --mupdf=false `
              --debug_with_timestamp=false
          }
          Write-Host "✅ Config done"

      # ================================================================
      # Step 7: 编译 (带重试)
      # ================================================================
      - name: Build Mogan Turbo
        run: |
          $maxRetries = 3
          for ($i=0; $i -lt $maxRetries; $i++) {
            Write-Host "Build attempt $($i+1)..."
            xmake build --yes -vD stem
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt ($maxRetries-1)) {
              Write-Host "⚠️ Build failed, retrying in 10s..."
              Start-Sleep -Seconds 10
            }
          }
          Write-Host "✅ Build done"

      # ================================================================
      # Step 8: 打包
      # ================================================================
      - name: Package Windows ZIP
        run: |
          New-Item -ItemType Directory -Force -Path mogan-turbo

          # 收集产物 (从 xmake 默认输出路径)
          $buildDir = "build\windows\x86_64\release"
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Recurse -Include *.exe,*.dll,*.pdb |
              Copy-Item -Destination mogan-turbo\ -Force -ErrorAction SilentlyContinue
          }

          # 也查一下其他可能的输出路径
          $altDirs = @("build", "build\windows")
          foreach ($d in $altDirs) {
            if (Test-Path $d) {
              Get-ChildItem -Path $d -Recurse -Include *.exe |
                Where-Object { $_.Name -like "*mogan*" -or $_.Name -like "*stem*" } |
                Copy-Item -Destination mogan-turbo\ -Force -ErrorAction SilentlyContinue
            }
          }

          $items = Get-ChildItem mogan-turbo
          if ($items.Count -eq 0) {
            Write-Host "⚠️ No binaries found in standard paths, searching all build..."
            Get-ChildItem -Path build -Recurse -Include *.exe -ErrorAction SilentlyContinue |
              Copy-Item -Destination mogan-turbo\ -Force
            Get-ChildItem -Path build -Recurse -Include *.dll -ErrorAction SilentlyContinue |
              Copy-Item -Destination mogan-turbo\ -Force
          }

          Compress-Archive -Path mogan-turbo\* -DestinationPath mogan-turbo-windows.zip -Force
          Write-Host "=== 📦 Package ==="
          Write-Host "Files:"
          Get-ChildItem mogan-turbo | Select-Object Name, Length
          Write-Host "Archive:"
          Get-Item mogan-turbo-windows.zip | Select-Object Name, Length

      # ================================================================
      # Step 9: 上传 Artifact
      # ================================================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mogan-turbo-windows
          path: mogan-turbo-windows.zip
          retention-days: 7
          compression-level: 1

      # ================================================================
      # Step 10: 构建摘要
      # ================================================================
      - name: Build Summary
        run: |
          Write-Host "========================================"
          Write-Host "  ✅ Mogan Turbo Windows Build Done"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "  📥 Download Artifact:"
          Write-Host "     mogan-turbo-windows → mogan-turbo-windows.zip"
          Write-Host ""
          Write-Host "  📋 优化项:"
          Write-Host "     • Release 模式 (关闭调试符号)"
          Write-Host "     • 关闭启动页"
          Write-Host "     • 关闭教程"
          Write-Host "     • 关闭 MuPDF"
          Write-Host "     • 关闭调试时间戳"
          Write-Host "     • 关闭文本浮动工具栏"
          Write-Host ""
          Write-Host "  ⚡ 二次构建: ~5-10 分钟 (缓存命中)"
          Write-Host "========================================"
